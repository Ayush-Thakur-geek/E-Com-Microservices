server:
  port: 9090

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: API-GATEWAY
  config:
    import: configserver:http://localhost:8888
  cloud:
    gateway:
      routes:
        - id: ORDER-SERVICE
          uri: http://localhost:8082/
          predicates:
            - Path=/order/**
          filters:
            - name: CircuitBreaker
              args:
                name: ORDER-SERVICE
                fallbackUri: forward:/orderServiceFallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        - id: PRODUCT-SERVICE
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product/**
          filters:
            - name: CircuitBreaker
              args:
                name: PRODUCT-SERVICE
                fallbackUri: forward:/productServiceFallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        - id: PAYMENT-SERVICE
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payment/**
          filters:
            - name: CircuitBreaker
              args:
                name: PAYMENT-SERVICE
                fallbackUri: forward:/paymentServiceFallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
      default-filters:
        - TokenRelay

  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: 38fB0dkO3Yel0NKvPxYhfl2aTWfaL95k
            client-secret: u9cffSnj41U2U3gkYDmYQmpmw8kcYcDrdmRp6POQOWm5GbUhdn5APxJWW-I7VKaf
            scope: openid, email, profile, offline_access, Customer, Admin
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/auth0"
        provider:
          auth0:
            issuer-uri: https://dev-wgukswd3g0sjbf77.us.auth0.com/
            jwk-set-uri: https://dev-wgukswd3g0sjbf77.us.auth0.com/.well-known/jwks.json
            
      resourceserver:
        jwt:
          issuer-uri: https://dev-wgukswd3g0sjbf77.us.auth0.com/

auth0:
  audience: https://dev-wgukswd3g0sjbf77.us.auth0.com/api/v2/


logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    org.springframework.security: DEBUG
